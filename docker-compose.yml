services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fairclaim
      POSTGRES_USER: fairclaim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fairclaim_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairclaim -d fairclaim"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fairclaim_pg:

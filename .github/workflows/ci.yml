name: FairClaim checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fairclaim
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: fairclaim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fairclaim -d fairclaim_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fairclaim:ci-only-test-password@127.0.0.1:5432/fairclaim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            mobile/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix mobile ci
      - run: npm test
      - run: npm run typecheck
      - run: npm --prefix server run build
      - run: npx expo export --platform android --output-dir dist
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://fairclaim.example
          EXPO_PUBLIC_SIWS_DOMAIN: fairclaim.example
          EXPO_PUBLIC_SIWS_URI: https://fairclaim.example
